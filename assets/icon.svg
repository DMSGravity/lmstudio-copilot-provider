<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Bar glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Bar gradient -->
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="16" fill="url(#bg-grad)" />
  
  <!-- Four blue bars - LM Studio inspired design -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="20" y="18" width="14" height="64" rx="7" fill="url(#bar-grad)" />
    <!-- Bar 2 -->
    <rect x="39" y="18" width="14" height="64" rx="7" fill="url(#bar-grad)" />
    <!-- Bar 3 -->
    <rect x="58" y="18" width="14" height="64" rx="7" fill="url(#bar-grad)" />
    <!-- Bar 4 -->
    <rect x="77" y="18" width="14" height="64" rx="7" fill="url(#bar-grad)" />
  </g>

  <!-- LM STUDIO text -->
  <text x="64" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">
    LM STUDIO
  </text>
</svg>